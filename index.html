<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPS Battle 🎮</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#17123b,#2563eb);
  color:white;
  min-height:100vh;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 15px;
}

h1{
  text-align:center;
  font-size:34px;
}

.card{
  background:rgba(255,255,255,.12);
  padding:20px;
  border-radius:20px;
  margin:15px 0;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

input{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  box-sizing:border-box;
  margin:7px 0;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  margin:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.blue{background:#6366f1;color:white}
.green{background:#22c55e;color:white}
.red{background:#ef4444;color:white}
.gray{background:#64748b;color:white}

.hidden{
  display:none;
}

.room{
  text-align:center;
  font-size:30px;
  color:#fde047;
  letter-spacing:6px;
  font-weight:bold;
}

.players{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
}

.player{
  flex:1;
  text-align:center;
  background:rgba(255,255,255,.08);
  padding:15px;
  border-radius:15px;
}

.name{
  font-size:20px;
  font-weight:bold;
}

.score{
  font-size:40px;
  color:#fde047;
}

.vs{
  font-size:25px;
  font-weight:bold;
}

.choices{
  text-align:center;
}

.choice{
  font-size:45px;
  width:90px;
  height:90px;
  background:rgba(255,255,255,.15);
  color:white;
}

.status,.result{
  text-align:center;
  font-size:20px;
  margin:15px;
}

.chat{
  height:200px;
  overflow-y:auto;
  background:rgba(0,0,0,.2);
  padding:10px;
  border-radius:12px;
}

.message{
  padding:7px;
  margin:5px 0;
  background:rgba(255,255,255,.1);
  border-radius:8px;
}

@media(max-width:500px){
  .players{
    flex-direction:column;
  }

  .vs{
    margin:0;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>✊ RPS BATTLE ✋</h1>

<!-- LOGIN -->
<div id="login" class="card">

<h2>👤 เข้าสู่เกม</h2>

<p>ใส่ชื่อของคุณ</p>

<input
  id="nameInput"
  maxlength="20"
  placeholder="เช่น Korn"
>

<button class="blue" onclick="login()">
🚀 เข้าเกม
</button>

</div>


<!-- MENU -->
<div id="menu" class="hidden">

<div class="card">

<h2>🎮 สร้างห้อง</h2>

<button class="green" onclick="createRoom()">
🏠 สร้างห้องใหม่
</button>

</div>


<div class="card">

<h2>🔑 เข้าห้อง</h2>

<input
  id="roomInput"
  maxlength="5"
  placeholder="ใส่รหัสห้อง เช่น ABC12"
>

<button class="blue" onclick="joinRoom()">
🚀 เข้าห้อง
</button>

</div>

</div>


<!-- GAME -->
<div id="game" class="hidden">

<div class="card">

<div style="text-align:center">
🔐 รหัสห้อง
</div>

<div id="roomCode" class="room"></div>

<p style="text-align:center">
ส่งรหัสนี้ให้เพื่อนเพื่อเข้ามาเล่น 🌍
</p>

</div>


<div class="card">

<div class="players">

<div class="player">

<div>👤 ผู้เล่น 1</div>

<div id="player1Name" class="name">
รอผู้เล่น...
</div>

<div id="score1" class="score">
0
</div>

</div>

<div class="vs">
VS
</div>

<div class="player">

<div>👤 ผู้เล่น 2</div>

<div id="player2Name" class="name">
รอผู้เล่น...
</div>

<div id="score2" class="score">
0
</div>

</div>

</div>

</div>


<div class="card">

<div id="status" class="status">
⏳ รอผู้เล่น...
</div>

<div id="choices" class="choices hidden">

<button class="choice" onclick="choose('rock')">
✊
</button>

<button class="choice" onclick="choose('paper')">
✋
</button>

<button class="choice" onclick="choose('scissors')">
✌️
</button>

</div>

<div id="result" class="result"></div>

<div style="text-align:center">

<button
  id="newRound"
  class="green hidden"
  onclick="newRound()">
🔄 รอบใหม่
</button>

</div>

</div>


<!-- CHAT -->
<div class="card">

<h2>💬 แชต</h2>

<div id="chatBox" class="chat"></div>

<input
  id="chatInput"
  maxlength="100"
  placeholder="พิมพ์ข้อความ..."
  onkeydown="if(event.key==='Enter')sendMessage()"
>

<button class="blue" onclick="sendMessage()">
ส่ง 💬
</button>

</div>


<div style="text-align:center">

<button class="red" onclick="location.reload()">
🚪 ออกจากห้อง
</button>

</div>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getDatabase,
ref,
set,
get,
update,
onValue,
push,
remove
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyDYIebLvIq25DiyLgsBwnE5px1CqgrC9j4",

authDomain:"rps-game-7baf2.firebaseapp.com",

databaseURL:
"https://rps-game-7baf2-default-rtdb.firebaseio.com",

projectId:"rps-game-7baf2",

storageBucket:
"rps-game-7baf2.firebasestorage.app",

messagingSenderId:"668427240160",

appId:
"1:668427240160:web:201df10712e1bbe8b48685",

measurementId:"G-88QY7T21K0"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* VARIABLES */

let myName="";
let roomCode="";
let myPlayer="";


/* LOGIN */

window.login=function(){

myName=
document.getElementById("nameInput")
.value.trim();

if(myName===""){

alert("กรุณาใส่ชื่อก่อนครับ 😄");

return;

}

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("menu")
.classList.remove("hidden");

};


/* CREATE ROOM */

window.createRoom=async function(){

roomCode=makeCode();

myPlayer="player1";

await set(
ref(db,"rooms/"+roomCode),
{

player1:{
name:myName,
choice:"",
score:0
},

player2:{
name:"",
choice:"",
score:0
},

status:"waiting",
result:""

}
);

enterRoom();

};


/* RANDOM CODE */

function makeCode(){

let chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let code="";

for(let i=0;i<5;i++){

code+=chars[
Math.floor(Math.random()*chars.length)
];

}

return code;

}


/* JOIN */

window.joinRoom=async function(){

roomCode=
document.getElementById("roomInput")
.value
.trim()
.toUpperCase();

if(roomCode.length!==5){

alert("รหัสห้องต้องมี 5 ตัวครับ");

return;

}

let snap=
await get(
ref(db,"rooms/"+roomCode)
);

if(!snap.exists()){

alert("ไม่พบห้องนี้ 😢");

return;

}

let room=snap.val();

if(room.player2.name){

alert("ห้องเต็มแล้ว 🚫");

return;

}

myPlayer="player2";

await update(
ref(db,"rooms/"+roomCode),
{

"player2/name":myName,
"status":"playing"

}
);

enterRoom();

};


/* ENTER */

function enterRoom(){

document
.getElementById("menu")
.classList.add("hidden");

document
.getElementById("game")
.classList.remove("hidden");

document
.getElementById("roomCode")
.textContent=roomCode;

listenRoom();

listenChat();

}


/* LISTEN ROOM */

function listenRoom(){

onValue(
ref(db,"rooms/"+roomCode),
snap=>{

if(!snap.exists()){

alert("ห้องถูกปิดแล้ว");

location.reload();

return;

}

let room=snap.val();

document
.getElementById("player1Name")
.textContent=
room.player1.name||"รอผู้เล่น...";

document
.getElementById("player2Name")
.textContent=
room.player2.name||"รอผู้เล่น...";

document
.getElementById("score1")
.textContent=
room.player1.score||0;

document
.getElementById("score2")
.textContent=
room.player2.score||0;


if(!room.player2.name){

document
.getElementById("status")
.textContent=
"⏳ รอผู้เล่นคนที่ 2...";

document
.getElementById("choices")
.classList.add("hidden");

return;

}


if(room.status==="playing"){

document
.getElementById("status")
.textContent=
"🎮 เลือกของคุณ!";

document
.getElementById("choices")
.classList.remove("hidden");

document
.getElementById("result")
.textContent="";

}


if(room.status==="result"){

document
.getElementById("choices")
.classList.add("hidden");

document
.getElementById("result")
.textContent=
room.result;

document
.getElementById("newRound")
.classList.remove("hidden");

}


if(
myPlayer==="player1" &&
room.status==="playing" &&
room.player1.choice &&
room.player2.choice
){

calculate(room);

}

}
);

}


/* CHOOSE */

window.choose=async function(choice){

await set(
ref(
db,
"rooms/"+roomCode+"/"+myPlayer+"/choice"
),
choice
);

document
.getElementById("status")
.textContent=
"✅ เลือกแล้ว! รออีกคน...";

};


/* CALCULATE */

async function calculate(room){

let a=room.player1.choice;

let b=room.player2.choice;

let winner="";

if(a===b){

winner="draw";

}
else if(

(a==="rock"&&b==="scissors")||
(a==="paper"&&b==="rock")||
(a==="scissors"&&b==="paper")

){

winner="player1";

}
else{

winner="player2";

}


let emoji={
rock:"✊",
paper:"✋",
scissors:"✌️"
};


let result="";

let score1=room.player1.score||0;

let score2=room.player2.score||0;


if(winner==="draw"){

result=
"🤝 เสมอ! "+
emoji[a]+" vs "+emoji[b];

}


if(winner==="player1"){

score1++;

result=
"🏆 "+room.player1.name+
" ชนะรอบนี้! "+
emoji[a]+" vs "+emoji[b];

}


if(winner==="player2"){

score2++;

result=
"🏆 "+room.player2.name+
" ชนะรอบนี้! "+
emoji[a]+" vs "+emoji[b];

}


await update(
ref(db,"rooms/"+roomCode),
{

"player1/score":score1,

"player2/score":score2,

status:"result",

result:result

}
);

}


/* NEW ROUND */

window.newRound=async function(){

if(myPlayer!=="player1"){

alert("ให้ผู้สร้างห้องกดรอบใหม่ครับ 😄");

return;

}

await update(
ref(db,"rooms/"+roomCode),
{

"player1/choice":"",
"player2/choice":"",

status:"playing",

result:""

}
);

};


/* CHAT */

function listenChat(){

onValue(
ref(db,"rooms/"+roomCode+"/messages"),
snap=>{

let box=
document.getElementById("chatBox");

box.innerHTML="";

snap.forEach(child=>{

let msg=child.val();

let div=
document.createElement("div");

div.className="message";

div.textContent=
msg.name+": "+msg.text;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

}
);

}


/* SEND CHAT */

window.sendMessage=async function(){

let input=
document.getElementById("chatInput");

let text=input.value.trim();

if(!text)return;

await push(
ref(db,"rooms/"+roomCode+"/messages"),
{

name:myName,

text:text

}
);

input.value="";

};

</script>

</body>
</html>
