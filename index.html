<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPS Battle Online</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#29447d,#11182f 55%,#070b18);
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.page{width:100%;max-width:650px}
.hidden{display:none!important}

.card{
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:28px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
backdrop-filter:blur(10px);
}

.logo{
font-size:46px;
font-weight:900;
text-align:center;
}
.subtitle{
text-align:center;
opacity:.75;
margin:5px 0 25px;
}

input{
width:100%;
padding:15px;
border:0;
outline:0;
border-radius:14px;
font-size:17px;
margin-bottom:12px;
}

button{
border:0;
border-radius:15px;
padding:14px 18px;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.18s;
}
button:active{transform:scale(.94)}

.mainButton{
width:100%;
background:#fff;
color:#17203d;
margin-top:8px;
}

.secondaryButton{
width:100%;
background:rgba(255,255,255,.15);
color:#fff;
margin-top:10px;
}

.status{
text-align:center;
font-size:14px;
opacity:.8;
margin:15px 0;
min-height:20px;
}

.divider{
display:flex;
align-items:center;
gap:10px;
margin:20px 0;
opacity:.5;
}
.divider:before,.divider:after{
content:"";
height:1px;
background:#fff;
opacity:.4;
flex:1;
}

.musicButton{
position:fixed;
right:15px;
top:15px;
background:rgba(255,255,255,.12);
color:#fff;
border:1px solid rgba(255,255,255,.15);
border-radius:50%;
width:50px;
height:50px;
padding:0;
font-size:22px;
z-index:10;
}

.roomBox{
background:rgba(0,0,0,.2);
padding:15px;
border-radius:16px;
text-align:center;
margin-bottom:15px;
}
.roomCode{
font-size:30px;
font-weight:900;
letter-spacing:5px;
color:#ffe27a;
}

.playerArea{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:12px;
margin:20px 0;
}
.player{
text-align:center;
background:rgba(255,255,255,.08);
padding:15px 8px;
border-radius:18px;
}
.avatar{font-size:42px}
.playerName{
font-weight:bold;
margin-top:5px;
word-break:break-word;
}
.score{
font-size:28px;
font-weight:900;
margin-top:5px;
color:#ffe27a;
}
.vs{
font-size:26px;
font-weight:900;
color:#ffcf5a;
}
.round{
text-align:center;
opacity:.8;
margin-bottom:10px;
}
.gameStatus{
text-align:center;
font-size:19px;
font-weight:bold;
min-height:30px;
}

.choices{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:20px;
}
.choice{
background:rgba(255,255,255,.12);
color:#fff;
font-size:55px;
padding:18px 5px;
border-radius:20px;
}
.choice:hover{
background:rgba(255,255,255,.22);
transform:translateY(-5px);
}
.choice.selected{
animation:selected .5s ease;
background:rgba(255,215,90,.25);
}
@keyframes selected{
0%{transform:scale(1)}
50%{transform:scale(1.2) rotate(-5deg)}
100%{transform:scale(1)}
}

.result{
text-align:center;
font-size:20px;
font-weight:bold;
min-height:35px;
margin:18px 0;
}
.result.show{animation:resultPop .5s ease}
@keyframes resultPop{
0%{transform:scale(.5);opacity:0}
70%{transform:scale(1.08);opacity:1}
100%{transform:scale(1)}
}

.vsScreen{
text-align:center;
padding:30px 10px;
}
.vsTitle{
font-size:35px;
font-weight:900;
margin-bottom:25px;
}
.vsPlayers{
display:flex;
justify-content:center;
align-items:center;
gap:25px;
}
.bigPlayer{
font-size:25px;
font-weight:bold;
max-width:180px;
word-break:break-word;
}
.bigAvatar{font-size:75px}
.bigVS{
font-size:42px;
font-weight:900;
color:#ffcf5a;
}
.countdown{
font-size:55px;
font-weight:900;
color:#ffe27a;
margin-top:25px;
}

.chat{margin-top:22px}
.chatBox{
height:160px;
overflow-y:auto;
background:rgba(0,0,0,.2);
border-radius:15px;
padding:12px;
}
.message{
padding:6px 4px;
word-break:break-word;
}
.message-name{
font-weight:bold;
color:#ffe27a;
}
.chatRow{
display:flex;
gap:8px;
margin-top:8px;
}
.chatRow input{
margin:0;
flex:1;
}
.sendButton{
width:60px;
padding:10px;
}

.bottomButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}
.danger{
background:#c94b5c;
color:#fff;
}

.winScreen{
text-align:center;
padding:25px 5px;
}
.trophy{
font-size:85px;
animation:trophy .8s ease;
}
@keyframes trophy{
0%{transform:scale(.3) rotate(-15deg)}
60%{transform:scale(1.15)}
100%{transform:scale(1)}
}
.finalTitle{
font-size:32px;
font-weight:900;
margin:10px 0;
}
.finalScore{
font-size:50px;
font-weight:900;
color:#ffe27a;
margin:15px;
}
.smallNote{
text-align:center;
font-size:13px;
opacity:.55;
margin-top:15px;
}

@media(max-width:500px){
.card{padding:20px}
.logo{font-size:38px}
.playerArea{gap:6px}
.choice{font-size:45px}
.bigVS{font-size:30px}
}
</style>
</head>

<body>

<button id="musicButton" class="musicButton">🔇</button>

<div class="page">

<!-- LOGIN -->
<div id="loginPage" class="card">

<div class="logo">✊✋✌️</div>
<div class="subtitle">RPS Battle Online</div>

<div id="firebaseStatus" class="status">
⏳ กำลังเชื่อมต่อเกม...
</div>

<input
id="nameInput"
type="text"
maxlength="20"
placeholder="ใส่ชื่อของคุณ">

<button id="loginButton" class="mainButton">
🎮 เข้าเกม
</button>

<div class="smallNote">
เล่นออนไลน์กับเพื่อนได้
</div>

</div>


<!-- MENU -->
<div id="menuPage" class="card hidden">

<div class="logo">⚔️ RPS</div>
<div class="subtitle">Battle Online</div>

<div style="text-align:center;margin-bottom:20px">
👤 <span id="myName"></span>
</div>

<button id="createButton" class="mainButton">
🏠 สร้างห้อง
</button>

<div class="divider">หรือ</div>

<input
id="roomInput"
type="text"
maxlength="5"
placeholder="กรอกรหัสห้อง 5 ตัว">

<button id="joinButton" class="secondaryButton">
🚪 เข้าร่วมห้อง
</button>

</div>


<!-- VS -->
<div id="vsPage" class="card hidden">

<div class="vsScreen">

<div class="vsTitle">⚔️ BATTLE</div>

<div class="vsPlayers">

<div class="bigPlayer">
<div class="bigAvatar">😎</div>
<div id="vsPlayer1">ผู้เล่น 1</div>
</div>

<div class="bigVS">VS</div>

<div class="bigPlayer">
<div class="bigAvatar">😎</div>
<div id="vsPlayer2">ผู้เล่น 2</div>
</div>

</div>

<div id="countdown" class="countdown">3</div>

</div>

</div>


<!-- GAME -->
<div id="gamePage" class="card hidden">

<div class="roomBox">
<div>ห้อง</div>
<div id="roomCode" class="roomCode">-----</div>
</div>

<div class="round">
<span id="roundText">ตาที่ 1 / 5</span>
</div>

<div class="playerArea">

<div class="player">
<div class="avatar">😎</div>
<div id="player1Name" class="playerName">รอผู้เล่น...</div>
<div id="score1" class="score">0</div>
</div>

<div class="vs">VS</div>

<div class="player">
<div class="avatar">😎</div>
<div id="player2Name" class="playerName">รอผู้เล่น...</div>
<div id="score2" class="score">0</div>
</div>

</div>

<div id="status" class="gameStatus">
⏳ รอผู้เล่นคนที่ 2...
</div>

<div id="choices" class="choices hidden">

<button id="rockButton" class="choice">✊</button>
<button id="paperButton" class="choice">✋</button>
<button id="scissorsButton" class="choice">✌️</button>

</div>

<div id="result" class="result"></div>


<!-- CHAT -->
<div class="chat">

<div style="font-weight:bold;margin-bottom:8px">
💬 แชต
</div>

<div id="chatBox" class="chatBox"></div>

<div class="chatRow">

<input
id="chatInput"
maxlength="100"
placeholder="พิมพ์ข้อความ...">

<button id="sendButton" class="sendButton">
➤
</button>

</div>

</div>


<div class="bottomButtons">

<button id="leaveButton" class="secondaryButton">
🚪 ออกจากห้อง
</button>

<button id="rematchButton" class="mainButton">
🔄 รีแมตช์
</button>

</div>

</div>


<!-- WIN -->
<div id="winPage" class="card hidden">

<div class="winScreen">

<div class="trophy">🏆</div>

<div id="finalTitle" class="finalTitle">
จบการแข่งขัน!
</div>

<div id="finalScore" class="finalScore">
0 - 0
</div>

<button id="playAgainButton" class="mainButton">
🔄 เล่นอีกครั้ง
</button>

<button id="backMenuButton" class="secondaryButton">
🏠 กลับเมนู
</button>

</div>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getDatabase,
ref,
set,
get,
update,
onValue,
push,
remove
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
getAuth,
signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig={

apiKey:"AIzaSyDYIebLvIq25DiyLgsBwnE5px1CqgrC9j4",

authDomain:"rps-game-7baf2.firebaseapp.com",

databaseURL:
"https://rps-game-7baf2-default-rtdb.firebaseio.com",

projectId:"rps-game-7baf2",

storageBucket:
"rps-game-7baf2.firebasestorage.app",

messagingSenderId:"668427240160",

appId:
"1:668427240160:web:201df10712e1bbe8b48685",

measurementId:"G-88QY7T21K0"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const auth=getAuth(app);


const loginPage=document.getElementById("loginPage");
const menuPage=document.getElementById("menuPage");
const vsPage=document.getElementById("vsPage");
const gamePage=document.getElementById("gamePage");
const winPage=document.getElementById("winPage");

const firebaseStatus=
document.getElementById("firebaseStatus");

const nameInput=
document.getElementById("nameInput");

const roomInput=
document.getElementById("roomInput");

const loginButton=
document.getElementById("loginButton");

const createButton=
document.getElementById("createButton");

const joinButton=
document.getElementById("joinButton");

const rockButton=
document.getElementById("rockButton");

const paperButton=
document.getElementById("paperButton");

const scissorsButton=
document.getElementById("scissorsButton");

const chatInput=
document.getElementById("chatInput");

const sendButton=
document.getElementById("sendButton");

const leaveButton=
document.getElementById("leaveButton");

const rematchButton=
document.getElementById("rematchButton");

const playAgainButton=
document.getElementById("playAgainButton");

const backMenuButton=
document.getElementById("backMenuButton");

const musicButton=
document.getElementById("musicButton");


let currentUser=null;
let myName="";
let roomCode="";
let myPlayer="";
let resolving=false;


/* FIREBASE */

async function connectFirebase(){

try{

firebaseStatus.textContent=
"⏳ กำลังเข้าสู่ระบบ...";

const userCredential=
await signInAnonymously(auth);

currentUser=userCredential.user;

firebaseStatus.textContent=
"🟢 เชื่อมต่อเกมสำเร็จ";

}catch(error){

console.error(error);

firebaseStatus.textContent=
"🔴 Firebase Error: "+error.code;

alert(
"เชื่อมต่อ Firebase ไม่สำเร็จ\n\n"+
error.code+"\n"+
error.message
);

}

}

connectFirebase();


/* LOGIN */

loginButton.addEventListener("click",function(){

if(!currentUser){

alert("ยังเชื่อมต่อ Firebase ไม่สำเร็จ");

return;
}

const name=nameInput.value.trim();

if(!name){

alert("กรุณาใส่ชื่อก่อนครับ 😄");

return;
}

myName=name;

document.getElementById("myName").textContent=myName;

loginPage.classList.add("hidden");

menuPage.classList.remove("hidden");

startMusic();

});


/* CREATE */

createButton.addEventListener("click",async function(){

if(!currentUser){

alert("ยังไม่ได้เชื่อมต่อ Firebase");

return;
}

roomCode=generateRoomCode();

myPlayer="player1";

try{

await set(
ref(db,"rooms/"+roomCode),
{

player1:{
name:myName,
uid:currentUser.uid,
choice:"",
score:0
},

player2:{
name:"",
uid:"",
choice:"",
score:0
},

round:0,
status:"waiting",
result:"",
messages:{}

}
);

showVS(myName,"รอผู้เล่น...");

}catch(error){

console.error(error);

alert(
"สร้างห้องไม่ได้\n\n"+
error.code+"\n"+
error.message
);

}

});


function generateRoomCode(){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let code="";

for(let i=0;i<5;i++){

code+=chars[
Math.floor(Math.random()*chars.length)
];

}

return code;

}


/* JOIN */

joinButton.addEventListener("click",async function(){

if(!currentUser){

alert("ยังไม่ได้เชื่อมต่อ Firebase");

return;
}

const code=
roomInput.value.trim().toUpperCase();

if(code.length!==5){

alert("รหัสห้องต้องมี 5 ตัวครับ");

return;
}

try{

const snapshot=
await get(ref(db,"rooms/"+code));

if(!snapshot.exists()){

alert("ไม่พบห้องนี้ 😢");

return;
}

const room=snapshot.val();

if(room.player2 && room.player2.name){

alert("ห้องนี้มีผู้เล่นครบแล้ว 🚫");

return;
}

roomCode=code;

myPlayer="player2";

await update(
ref(db,"rooms/"+roomCode),
{

"player2/name":myName,
"player2/uid":currentUser.uid,
"player2/choice":"",
"player2/score":0,
status:"playing"

}
);

showVS(room.player1.name,myName);

}catch(error){

console.error(error);

alert(
"เข้าห้องไม่ได้\n\n"+
error.code+"\n"+
error.message
);

}

});


/* VS SCREEN */

function showVS(player1,player2){

menuPage.classList.add("hidden");

vsPage.classList.remove("hidden");

document.getElementById("vsPlayer1")
.textContent=player1||"ผู้เล่น 1";

document.getElementById("vsPlayer2")
.textContent=player2||"ผู้เล่น 2";

let number=3;

const countdown=
document.getElementById("countdown");

countdown.textContent=number;

const timer=setInterval(function(){

number--;

if(number>0){

countdown.textContent=number;

}else{

countdown.textContent="GO!";

clearInterval(timer);

setTimeout(function(){

vsPage.classList.add("hidden");

gamePage.classList.remove("hidden");

document.getElementById("roomCode")
.textContent=roomCode;

listenRoom();

listenChat();

},700);

}

},1000);

}


/* ROOM */

function listenRoom(){

onValue(
ref(db,"rooms/"+roomCode),
function(snapshot){

if(!snapshot.exists()){

alert("ห้องนี้ถูกปิดแล้ว");

location.reload();

return;
}

const room=snapshot.val();

updatePlayers(room);

updateGame(room);

if(
myPlayer==="player1" &&
room.status==="playing" &&
room.player1.choice &&
room.player2.choice &&
!resolving
){

calculateResult(room);

}

if(room.status==="finished"){

showWinScreen(room);

}

}
);

}


/* PLAYERS */

function updatePlayers(room){

document.getElementById("player1Name")
.textContent=
room.player1.name||"รอผู้เล่น...";

document.getElementById("player2Name")
.textContent=
room.player2.name||"รอผู้เล่น...";

document.getElementById("score1")
.textContent=
room.player1.score||0;

document.getElementById("score2")
.textContent=
room.player2.score||0;

const round=room.round||0;

document.getElementById("roundText")
.textContent=
"ตาที่ "+Math.min(round+1,5)+" / 5";

}


/* GAME */

function updateGame(room){

const status=
document.getElementById("status");

const choices=
document.getElementById("choices");

const result=
document.getElementById("result");

if(!room.player2.name){

status.textContent=
"⏳ รอผู้เล่นคนที่ 2...";

choices.classList.add("hidden");

return;
}

if(room.status==="playing"){

status.textContent=
"🎮 เลือก ✊ ✋ หรือ ✌️";

choices.classList.remove("hidden");

return;
}

if(room.status==="resolving"){

choices.classList.add("hidden");

status.textContent=
"⏳ กำลังตัดสินผล...";

return;
}

if(room.status==="finished"){

choices.classList.add("hidden");

status.textContent=
"🏆 จบการแข่งขัน!";

result.textContent=room.result||"";

}

}
  /* CHOICES */

rockButton.addEventListener("click",function(){
choose("rock");
});

paperButton.addEventListener("click",function(){
choose("paper");
});

scissorsButton.addEventListener("click",function(){
choose("scissors");
});


async function choose(choice){

if(!currentUser){

alert("ยังไม่ได้เชื่อมต่อ Firebase");

return;
}

if(!roomCode||!myPlayer){

alert("ยังไม่ได้เข้าห้อง");

return;
}

try{

rockButton.classList.remove("selected");
paperButton.classList.remove("selected");
scissorsButton.classList.remove("selected");

if(choice==="rock")
rockButton.classList.add("selected");

if(choice==="paper")
paperButton.classList.add("selected");

if(choice==="scissors")
scissorsButton.classList.add("selected");

await set(
ref(
db,
"rooms/"+roomCode+"/"+myPlayer+"/choice"
),
choice
);

document.getElementById("status")
.textContent=
"✅ เลือกแล้ว! รออีกคน...";

}catch(error){

console.error(error);

alert(
"เลือกไม่ได้\n\n"+
error.code+"\n"+
error.message
);

}

}


/* RESULT */

async function calculateResult(room){

if(resolving)return;

resolving=true;

try{

await update(
ref(db,"rooms/"+roomCode),
{status:"resolving"}
);

const a=room.player1.choice;
const b=room.player2.choice;

const emoji={
rock:"✊",
paper:"✋",
scissors:"✌️"
};


if(a===b){

await update(
ref(db,"rooms/"+roomCode),
{

"player1/choice":"",
"player2/choice":"",
status:"playing",

result:
"🤝 เสมอ! "+
emoji[a]+" VS "+emoji[b]+
" เล่นตานี้ใหม่!"

}
);

resolving=false;

return;
}


let winner="";

if(
(a==="rock"&&b==="scissors")||
(a==="paper"&&b==="rock")||
(a==="scissors"&&b==="paper")
){

winner="player1";

}else{

winner="player2";

}


let score1=room.player1.score||0;
let score2=room.player2.score||0;
let round=room.round||0;

if(winner==="player1")score1++;
else score2++;

round++;

let resultText="";

if(winner==="player1"){

resultText=
"🏆 "+room.player1.name+
" ชนะตานี้! "+
emoji[a]+" VS "+emoji[b];

}else{

resultText=
"🏆 "+room.player2.name+
" ชนะตานี้! "+
emoji[a]+" VS "+emoji[b];

}


if(round>=5){

let finalText="";

if(score1>score2){

finalText=
"🏆🎉 "+room.player1.name+
" ชนะการแข่งขัน!";

}else if(score2>score1){

finalText=
"🏆🎉 "+room.player2.name+
" ชนะการแข่งขัน!";

}else{

finalText="🤝🎉 เสมอกัน!";

}

await update(
ref(db,"rooms/"+roomCode),
{

"player1/score":score1,
"player2/score":score2,

"player1/choice":"",
"player2/choice":"",

round:round,

status:"finished",

result:
finalText+" "+
score1+" - "+score2

}
);

resolving=false;

return;

}


await update(
ref(db,"rooms/"+roomCode),
{

"player1/score":score1,
"player2/score":score2,

"player1/choice":"",
"player2/choice":"",

round:round,

status:"playing",

result:resultText

}
);

resolving=false;

}catch(error){

resolving=false;

console.error(error);

alert(
"คำนวณผลไม่สำเร็จ\n\n"+
error.code+"\n"+
error.message
);

}

}

const score2=room.player2.score||0;

document.getElementById("finalScore")

myPlayer==="player1"
?"🏆 คุณชนะ!"

:"😅 คุณแพ้!";

}

document.getElementById("finalTitle")
.textContent=title;

}

  /* RELAXING MUSIC */

let audioContext=null;
let musicTimer=null;
let musicOn=false;

function startMusic(){

if(musicOn)return;

try{

audioContext=
new (
window.AudioContext||
window.webkitAudioContext
)();

if(audioContext.state==="suspended")
audioContext.resume();

musicOn=true;

musicButton.textContent="🔊";

playRelaxingNote();

musicTimer=setInterval(
playRelaxingNote,
1800
);

}catch(error){

console.log("Audio unavailable");

}

}


function stopMusic(){

musicOn=false;

if(musicTimer){

clearInterval(musicTimer);

musicTimer=null;

}

if(audioContext){

audioContext.close();

audioContext=null;

}

musicButton.textContent="🔇";

}


musicButton.addEventListener(
"click",
function(){

if(musicOn){

stopMusic();

}else{

startMusic();

}

});


function playRelaxingNote(){

if(!audioContext||!musicOn)
return;

const notes=[
261.63,
329.63,
392.00,
523.25,
392.00,
329.63
];

const frequency=
notes[
Math.floor(
Math.random()*notes.length
)
];

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.value=
frequency;

gain.gain.setValueAtTime(
0,
audioContext.currentTime
);

gain.gain.linearRampToValueAtTime(
0.035,
audioContext.currentTime+0.15
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime+1.5
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start();

oscillator.stop(
audioContext.currentTime+1.5
);

}
